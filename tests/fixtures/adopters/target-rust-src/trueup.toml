# Snapshot of target-rust/src/trueup.toml, copied 2026-11-12 by scripts/sync_adopters.py; do not edit.
# trueup configuration. The trueup skill writes this file. A person can edit it.
version = 1
run_date = "2026-10-07"
tier = "auto"                # auto | T0 | T1 | T2 | T3
public = false                # true adds C1, C2 and the public health files
docs = "full"                # full | readme
stale_days = 180                # P8
ignore = []   # globs left out of the survey and all findings
protect = []                 # globs that apply never changes or removes

[root]
allow = []                   # root entries allowed beyond the base list (D5.8)

[scratch]
allow = []                   # paths or names the scratch rule lets through (D5.8)

[refs]
local_tags = ["B", "E", "F", "G", "I", "L", "M", "P", "R", "S", "T", "W", "X", "A"]                   # the project's own tag prefixes (D8.7)
declared = ["../.state/runs/*/03-design.md", "../docs/features/s5-invariants/03-design.md", "../FABLE.md", "../FABLE-PLAN.md"]
id_forms = ["D<n>.<m>", "D<n>.<m>.<k>", "D-<n>", "I-<n>"]
layout = false                   # check h off: the pages keep their paths (D9.4)

[languages]                  # one key per language: strict | clean | off
rust = "clean"
typescript = "clean"
shell = "clean"

[binary]                     # review screenshots kept on purpose (D13.2)
allow = [".impeccable/review/*.png", "crates/app-flight/tools/shots/*.png"]   # the impeccable audit and the check.sh page proofs

[[keep]]                     # a finding the person declined, with the reason
id = "health-codeowners:"
reason = "one maintainer and no git remote, so no platform reads CODEOWNERS (2026-10-07)"

[[keep]]                     # a finding the person declined, with the reason
id = "health-license:"
reason = "private repository with no git remote; no license is chosen (2026-10-07)"

[[keep]]                     # a finding the person declined, with the reason
id = "refcheck:README.md:1:no-licence-file"
reason = "private repository with no git remote; no license is chosen (2026-10-07)"
