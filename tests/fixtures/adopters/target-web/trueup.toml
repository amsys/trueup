# Snapshot of target-web/trueup.toml, copied 2026-11-09 by scripts/sync_adopters.py; do not edit.
# trueup configuration. The trueup skill writes this file. A person can edit it.
version = 1
run_date = "2026-10-16"
tier = "T1"                # auto | T0 | T1 | T2 | T3
public = false                # true adds C1, C2 and the public health files
docs = "auto"                # auto | full | readme
stale_days = 180                # P8
ignore = []   # globs left out of the survey and all findings
protect = []                 # globs that apply never changes or removes

[root]
allow = ["research", "3d", "survey", "website"]                 # root entries allowed beyond the base list (D5.8)

[scratch]
allow = []                   # paths or names the scratch rule lets through (D5.8)

[layout]
code_dirs = ["memory"]

[languages]                  # one key per language: strict | clean | off
typescript = "clean"

[[keep]]                     # a finding the person declined, with the reason
id = "health-license:"
reason = "private repository, no licence granted (owner, 2026-10-16)"

[[keep]]
id = "doc-misplaced:survey/desk-answers.md"
reason = "survey worker data: desk answers and evidence tables kept beside the survey pages they answer (2026-10-17)"

[[keep]]
id = "doc-misplaced:survey/desk/fields.md"
reason = "survey worker data: desk answers and evidence tables kept beside the survey pages they answer (2026-10-17)"

