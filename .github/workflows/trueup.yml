# GitHub Actions workflow: `check` runs the enabled hooks and the test
# suite on every push and pull request, on the oldest and the newest
# supported Python. The step summary lists each skipped test with its reason.
# Each action is pinned to a full commit SHA; the comment gives its tag.
name: trueup

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pre-commit pytest
      - run: pip install .
      - name: install gitleaks 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
      # install the tools of your languages here, one line per family
      # The versions are the ones that the trueup CI template pins.
      - run: pip install ruff==0.15.9 vale==3.26.0.1
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: npm ci --prefix lint/ts
      # The trueup-lint hook runs trueup lint once here. Do not add a second run.
      - run: pre-commit run --all-files
      - run: trueup check --root .
      # The explicit bash shell sets pipefail, so a failed test fails the step.
      - name: run the test suite
        shell: bash
        run: pytest -q -rs -p no:cacheprovider | tee "$RUNNER_TEMP/pytest.out"
      - name: list the skipped tests
        if: always()
        run: grep '^SKIPPED' "$RUNNER_TEMP/pytest.out" >> "$GITHUB_STEP_SUMMARY" || true
      - run: gitleaks git . --redact --no-banner
      # the dependency scan runs here when a lockfile is tracked
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --recursive
            ./
      # When osv-scanner cannot run, use the audit tool of the ecosystem:
      # python: pip-audit
      # rust: cargo audit
      # typescript: npm audit --audit-level=high
      # go: govulncheck ./...
      # php: composer audit

