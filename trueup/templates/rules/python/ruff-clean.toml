# Managed by trueup. Edit trueup.toml, then run the trueup skill.
# Python lint rules, clean mode: ruff's default rules plus the comment
# standard (pydocstyle with the Google convention, no blanket noqa, no
# unused noqa, and no to-do marker without an author, a link or a text)
# plus the bandit security rules (S).

[lint]
extend-select = ["D", "PGH004", "RUF100", "TD002", "TD003", "TD004", "TD005", "S"]
# S603, S607: every subprocess call in this project passes a list of
# arguments with no shell, and a `which()`-found path adds no risk a
# reviewer needs to check.
extend-ignore = ["S603", "S607"]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
# Tests use `assert`, fake credentials and fixed temporary paths on purpose.
"**/tests/**" = ["S101", "S105", "S106", "S108"]
"**/test_*.py" = ["S101", "S105", "S106", "S108"]
