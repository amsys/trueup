# Managed by trueup. Edit trueup.toml, then run the trueup skill.
# Python lint rules, strict mode: every stable ruff rule, with the shared
# thresholds (cyclomatic 10, 5 parameters, nesting 4, 5 boolean terms).
# COM812 and ISC001 are off because they conflict with ruff format.
# preview and explicit-preview-rules turn on one preview rule, PLR1702
# (nesting depth), and keep every other preview rule off. `ALL` already
# gains the bandit security rules (S).

[lint]
select = ["ALL"]
# S603, S607: every subprocess call in this project passes a list of
# arguments with no shell, and a `which()`-found path adds no risk a
# reviewer needs to check.
# CPY: the comment standard rules out a copyright header in each file.
ignore = ["COM812", "ISC001", "CPY", "S603", "S607"]
preview = true
explicit-preview-rules = true
extend-select = ["PLR1702"]

[lint.pydocstyle]
convention = "google"

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 5
max-positional-args = 5
max-branches = 12
max-returns = 6
max-statements = 50
max-nested-blocks = 4
max-bool-expr = 5

[lint.per-file-ignores]
# Tests use `assert`, fake credentials and fixed temporary paths on purpose.
"**/tests/**" = ["S101", "S105", "S106", "S108"]
"**/test_*.py" = ["S101", "S105", "S106", "S108"]
