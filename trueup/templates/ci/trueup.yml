# GitHub Actions workflow: on every push and pull request, `trueup check`
# reports the findings of the repository, then `trueup lint` runs the
# linters of its languages. Each action is pinned to a full commit SHA;
# the comment gives its tag.
name: trueup

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The full history gives check the same tier as a local clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # install trueup here, for example: pip install <path or URL of trueup>
      - name: install gitleaks 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
      - name: install ruff and vale
        run: pip install ruff==0.15.9 vale==3.26.0.1
      # Install the tools of your other languages here, one line per family
      # (shellcheck, shfmt, golangci-lint, cargo clippy, phpstan, and
      # `trueup lint --install` for jscpd, sqlfluff and the eslint packages).
      # `trueup lint` exits 2 when a tool is missing. The opt-out is
      # `trueup lint --skip-missing`.
      - run: trueup check --root .
      - run: trueup lint --root .
      # The dependency scan. Remove this step when the repository tracks no lockfile.
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --recursive
            ./
      # When osv-scanner cannot run, use the audit tool of the ecosystem:
      # python: pip-audit
      # rust: cargo audit
      # typescript: npm audit --audit-level=high
      # go: govulncheck ./...
      # php: composer audit
